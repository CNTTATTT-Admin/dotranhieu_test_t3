services:

  mysql:
    image: mysql:8
    container_name: lms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 09022005
      MYSQL_DATABASE: thpt_lms
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  lms:
    build: .
    image: lms-app:latest
    depends_on:
      - mysql
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/thpt_lms?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "09022005"
    restart: unless-stopped

volumes:
  mysql-data: